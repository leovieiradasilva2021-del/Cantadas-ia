<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rizz AI — Assistente de Paquera</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0d0d12; color: #ffffff; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; background: #16161e; border-radius: 24px; padding: 24px; border: 1px solid #2a2a3a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 8px; background: linear-gradient(45deg, #ff4b72, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { text-align: center; color: #8a8a9e; font-size: 14px; margin-bottom: 24px; }
    
    .upload-box { border: 2px dashed #3a3a4e; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; background: #1f1f2e; transition: 0.2s; margin-bottom: 16px; }
    .upload-box:hover { border-color: #ff4b72; }
    .upload-box p { color: #aaa; font-size: 14px; margin-top: 8px; }
    #preview { max-width: 100%; max-height: 200px; border-radius: 12px; display: none; margin: 10px auto 0; }
    
    textarea { width: 100%; height: 70px; background: #1f1f2e; border: 1px solid #2a2a3a; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; resize: none; margin-bottom: 16px; outline: none; }
    textarea:focus { border-color: #a855f7; }
    
    button { width: 100%; background: linear-gradient(90deg, #ff4b72, #a855f7); color: white; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    
    #resultado { margin-top: 20px; padding: 16px; background: #1f1f2e; border-radius: 14px; border: 1px solid #2a2a3a; font-size: 15px; line-height: 1.6; white-space: pre-line; display: none; color: #e2e2e8; }
  </style>
</head>
<body>

  <div class="container">
    <h1>RIZZ AI 🔥</h1>
    <p class="subtitle">Envie o print da conversa ou foto do perfil</p>

    <!-- ÁREA DE UPLOAD -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <span>📷</span>
      <p id="uploadText">Toque para selecionar print ou foto</p>
      <img id="preview" alt="Preview">
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="mostrarPreview(event)">

    <!-- CONTEXTO OPCIONAL -->
    <textarea id="contexto" placeholder="Detalhe extra (opcional): Ex: Quero uma resposta engraçada..."></textarea>

    <!-- BOTÃO -->
    <button id="btnGerar" onclick="analisarEGerar()">GERAR RESPOSTAS</button>

    <!-- RESULTADO -->
    <div id="resultado"></div>
  </div>

  <script>
    let imagemBase64 = null;

    function mostrarPreview(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagemBase64 = e.target.result;
          const img = document.getElementById('preview');
          img.src = imagemBase64;
          img.style.display = 'block';
          document.getElementById('uploadText').innerText = "Foto selecionada!";
        }
        reader.readAsDataURL(file);
      }
    }

    async function analisarEGerar() {
      const contexto = document.getElementById('contexto').value;
      const resDiv = document.getElementById('resultado');
      const btn = document.getElementById('btnGerar');

      if (!imagemBase64 && !contexto.trim()) {
        alert("Envie uma foto/print ou digite um contexto!");
        return;
      }

      resDiv.style.display = "block";
      resDiv.innerHTML = "Lendo a imagem e criando respostas... ⚡";
      btn.disabled = true;

      const prompt = `Você é um assistente de paquera estilo Rizz AI. 
Análise a imagem enviada (print de conversa do Tinder/Instagram ou foto de perfil) e o contexto extra: "${contexto}".
Crie 3 opções de respostas/mensagens diretas, magnéticas e naturais:
1. Engraçada / Provocante
2. Direta / Charmosa
3. Criativa / Curiosa
Formatado de forma limpa e direta.`;

      try {
        let resposta;
        if (imagemBase64) {
          // Passa a imagem + o prompt para o modelo com visão do Puter
          resposta = await puter.ai.chat(prompt, imagemBase64);
        } else {
          resposta = await puter.ai.chat(prompt);
        }
        resDiv.innerHTML = resposta;
      } catch (erro) {
        resDiv.innerHTML = "Erro ao analisar. Tente novamente!";
        console.error(erro);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
